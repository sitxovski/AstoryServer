; EacServer.ini — образец конфигурации AsdaEacServer.exe (EAC Э1, 16.10.2026).
; Место на стойке: @@ASTORY_SERVER_ROOT@@\Working_ASDA\v2\EacServer\EacServer.ini (рядом с exe).
; Относительные пути считаются от папки exe. Комментарии — только отдельной строкой (';' в конце значения не режется).
; Значения по умолчанию — из контракта Reports/anticheat/eac/CONTRACT.md.

[General]
; 0 — EAC выключен (REG_RESULT 4, кик никогда); 1 — журнал (решения пишутся, KICK в P73 не шлётся); 2 — кик
Mode=1
; 1 — не кикать: до первой успешной BeginSession, FailOpenStartupSec после старта, EpicDownHoldSec после сбоя связи с Epic
FailOpen=1
; ★ 22.11.2026: 180 — клиент после рестарта возвращается по лестнице 2+4+8+16+32+60 = 122 с плюс Connect / REG / RemoteAuth ~13 с
FailOpenStartupSec=180
EpicDownHoldSec=60
; ред. 3 (E1-03): «Epic недоступен» — доля временных отказов VerifyIdToken >= RatioPct % от >= MinIps разных IP за WindowSec,
; или >= EosCallErrorsMax временных ошибок RegisterClient/ReceiveMessageFromClient за то же окно (одна чужая REG — НЕ повод)
EpicDownWindowSec=60
EpicDownMinIps=5
EpicDownRatioPct=50
EosCallErrorsMax=5
; ред. 3 (E1-09): «AsdaId деградировал» (доля 503 за окно) — тоже FailOpen на EpicDownHoldSec
IdDegradedWindowSec=60
IdDegradedMinRequests=5
IdDegradedRatioPct=50
; журнал logs\eac_YYYYMMDD.log; LogLevel 0 ошибки, 1 +предупреждения, 2 +события, 3 +отладка
LogDir=logs
LogLevel=2
StatsSec=60

[Secrets]
; ClientId/Secret AlphaServer (TrustedServer) — только на сервере, ACL папки secrets: Administrators, SYSTEM
EosJson=secrets\eos.json
; ключ JWT RS256 — создаётся при первом запуске, если файла нет (права наследуются от папки secrets)
JwtKey=secrets\jwt_rs256.key
; пароль SQL-логина eac_auth (одна строка)
SqlPasswordFile=secrets\sql_eac_auth.txt
; долговременный ключ AsdaSecure (тот же, что у GameServer/LoginManager; md5 одинаков у всех трёх копий, 16.10) — только чтение
SecureKeyFile=..\GameServer\secure_server.key

[Sidecar]
; TCP 15901 (наружу; контракт ред. 2 — 15701 занят NpcServer; проброс 15901 на роутере нужен — Э2-0)
Bind=0.0.0.0
Port=15901
HandshakeTimeoutSec=10
; контракт §3: REG в течение 30 с после рукопожатия, без PING 30 с — разрыв
RegTimeoutSec=30
PingTimeoutSec=30
VerifyTimeoutSec=45
MaxConnections=2000
MaxUnregPerIp=16
MaxQueuedAcMsg=64
; ред. 3 (E1-01): без RemoteAuthComplete за AuthTimeoutSec от RegisterClient — причина 4
; ред. 3 §8.6 (R3-01): REG учётки не чаще 6 за 600 с; REG, вытесняющая Authenticated-сессию той же учётки с того же IP, в лимит не считается
AuthTimeoutSec=90
RegPerAccountMax=6
RegPerAccountWindowSec=600
; ред. 3 (E1-03): REG с одного IP в минуту
RegPerIpPerMin=10
; ред. 3 (E1-02): BIND — до 4 на EAC-сессию, несопоставленные хранятся 300 с
BindKeepSec=300
MaxBindsPerSession=4
; E1-04: приём под шквалом — accept за проход цикла, token bucket на IP и общий, отказы — сводкой раз в RejectSummarySec
AcceptPerPass=32
ConnectRatePerIp=5
ConnectBurstPerIp=20
ConnectRateGlobal=300
ConnectBurstGlobal=600
RejectSummarySec=10

[Bridge]
; TCP 127.0.0.1:15702 — адрес не настраивается (контракт §4: только 127.0.0.1)
Port=15702
HelloTimeoutSec=10
PingTimeoutSec=20
OrphanSec=120
; ред. 3 (E1-13): мост пускает только процесс с образом из списка имён И каталогов (pid HELLO = pid владельца соединения)
CheckPeerProcess=1
AllowedImageNames=GameServer.exe
AllowedImageDirs=..\GameServer;..\Indun_GameServer

[Policy]
BindTimeoutSec=60
GraceSec=30
KickRepeatSec=30
; ред. 3 (E1-02): 1 — дополнительно требовать IP канала 15901 == IP игры
RequireSameIp=0
; отказ регистрации учётки помнится (причина 4 вместо 1); разовое ожидание идущей проверки токена той же учётки
RejectMemorySec=300
VerifyWaitSec=15
; ★ Д2 (22.11.2026): REG не считается в RegPerAccountMax, если за столько секунд до неё у учётки была аутентифицированная EAC-сессия
; с того же IP (честный перезапуск после падения клиента); 0 — как раньше. 600 = окну предела RegPerAccountWindowSec
RegFreeAfterAuthSec=600
; ★ Д3 ред. 2 (ревизия 64): поблажка ОДНОЙ учётке «Epic Connect у клиента не проходит» — только с аутентифицированной EAC-сессией
; за AuthHistoryDays (история — AuthHistoryFile, переживает рестарт), пока её клиенту AsdaId выдаёт токены (последний не старше
; ConnectGraceTokenSec), а EAC-сессии и REG в этой игровой сессии нет; нарушений EAC нет (ConnectGraceAfterViolationDays); пределы — эпизод
; ConnectGraceEpisodeSec, скользящие 24 ч ConnectGraceSecPerDay, не больше ConnectGraceDaysPer30 суток за 30. Поблажкой кик за
; ClientActionRequired не глушится (FailOpen — глушит, как и прежде). Папка истории — с DACL только SYSTEM / Administrators
; Общего признака «≥ 3 учёток без REG» больше нет. ConnectGraceSecPerDay=0 — поблажки нет
AuthHistoryFile=state\auth_history.dat
AuthHistoryDays=30
ConnectGraceTokenSec=180
ConnectGraceSecPerDay=3600
ConnectGraceEpisodeSec=2400
ConnectGraceEpisodeGapSec=600
ConnectGraceDaysPer30=2
ConnectGraceAfterViolationDays=30
; ★ ревизия 68: ConnectGraceDaysPer30 — окна по 24 ч от начала эпизода (не календарные сутки) за AuthHistoryDays; AuthHistoryDays
; должен быть >= 30 и >= ConnectGraceAfterViolationDays, иначе поблажка выключается (журнал), EAC работает
; UserIndex операторов (только журнал, KICK не шлётся). ★ Д4 (22.11.2026): на стойке 1,2 (GMFlag=1 в Joy1.dbo.CharGmInfo) — иначе EacServer
; шлёт KICK оператору каждые KickRepeatSec, а P73 каждый отклоняет (18.10: 23 KICK за 11 мин)
OperatorUserIndex=1,2

[AsdaId]
; HTTP 127.0.0.1:8444 (адрес не настраивается), наружу — https://@@ASTORY_AUTH_HOST@@ через Caddy
Port=8444
Issuer=https://@@ASTORY_AUTH_HOST@@
Audience=astory-eac
AccessTtlSec=3600
; ред. 3 (E1-10): refresh живёт RefreshTtlSec с последнего использования, но не дольше RefreshAbsoluteSec от /token;
; хеши — в RefreshFile под DPAPI LocalMachine (переживают перезапуск); E1-19: перепроверка учётки на /refresh раз в StatusRecheckSec
RefreshTtlSec=43200
RefreshAbsoluteSec=604800
RefreshFile=secrets\refresh.dat
StatusRecheckSec=900
TokenPerIpPerMin=10
; ред. 3 (E1-06): LoginFailMax неудач на пару (логин, IP) → пауза пары; LoginGlobalFailMax на логин со всех IP → пауза
; по ступеням LoginPauseStagesSec (сброс успехом); IP прежних успешных входов общей паузы не получают
LoginFailMax=5
LoginFailPauseSec=60
LoginGlobalFailMax=10
LoginPauseStagesSec=60,300,3600
LoginKnownIpDays=30
; неудача пароля пишется в us_pwfail (UPEacAuthFail) через FailWriteDelayMs
FailWrite=1
FailWriteDelayMs=3000
; 1 — IP клиента берётся из последнего элемента X-Forwarded-For, если соединение пришло с 127.0.0.1 (Caddy)
TrustForwardedFor=1
; ред. 3 (E1-05): нити БД; весь запрос — за RequestDeadlineSec от accept; статика Caddy — WwwDir\.well-known\
Workers=8
RequestDeadlineSec=5
MaxPendingConns=1024
WwwDir=www
; ★ 17.10.2026 GET /status для лаунчера (пинг, «онлайн/офлайн»): по таблице слушающих портов Windows, без подключений к ним;
; ответ кэшируется на StatusCacheMs (любое число лаунчеров = одна проверка за срок)
StatusLoginPort=15001
StatusGamePort=15601
StatusCacheMs=2000
MaxRefreshPerUser=10

[AdminStatus]
; ★ А6.8 (22.11.2026): точка статуса EAC для админ-центра — ТОЛЬКО 127.0.0.1:Port, только чтение (src/AdminStatus.h); 0 — нет точки и истории
; событий (как до А6.8). На стойке Enabled=1 (дописывает tools/deploy_eac_a68.py). Секрет — одна строка ≥ 32 знаков, копия у службы панели
Enabled=0
Port=8447
SecretFile=secrets\admin_status.key
ReqPerSec=20
ReqBurst=40
FailPerMin=5
DeadlineMs=2000
SnapshotMaxAgeMs=1000
EventsPerAccount=20
EventKeepSec=86400
MaxAccounts=5000

[Sql]
; без пароля — он в SqlPasswordFile; SQLEXPRESS слушает 1433 (проверено 16.10)
ConnectionString=Driver={ODBC Driver 17 for SQL Server};Server=tcp:127.0.0.1,1433;Database=Joy1;UID=eac_auth;Encrypt=no
TimeoutSec=5

[Eos]
; BeginSession.RegisterTimeoutSeconds (10..120)
RegisterTimeoutSec=60
TickMs=30
ServerName=AsdaReborn
CacheDir=cache
; EOS_ELogLevel: 400 Info, 500 Verbose, 600 VeryVerbose (секреты и токены вымарываются)
LogLevel=500
