; * NASHA pravka (2026-11-22, A6.12, reshenie vladel'tsa 22.11 N5): zhurnal chata (90 sutok) i zaglushka chata na srok.
;   Skhema joylog1.chat (AstoryServer/Docs/SQL/chat_01_migrate.sql). Pervaya vykladka - Mode=0 (tol'ko zhurnal).
;   Dokument: AstoryServer/Docs/GameServer/chat-log-p129.md
[P129_ChatLog]
; * 1 = obshchiy geyt P47 (0x42AB4F) razbiraet vse kanaly chata klienta (5084/5086/6560/5088/5105/4120/6718/6313/6316)
;   i krik predmetom (call 0x4F0C6D/0x4F0C88): zhurnal joylog1.chat.message + proverka zaglushki chat.mute. 0 = stok.
Enabled=1
; 0 = tol'ko zhurnal (zaglushka tol'ko pomechaetsya: mute_state=2); 1 = zaglushka DEYSTVUET: tekst nikomu ne ukhodit,
;   igroku - notis 3113 (mute_state=1).
Mode=0
; 1 = pisat' zhurnal chata v bazu (ochered' bez ozhidaniya igrovogo potoka); 0 = ne pisat' (zaglushka rabotaet).
LogEnabled=1
; Desyatichnaya maska kanalov zhurnala (bit = 1 << kod): 1 obychnyy, 2 global'nyy, 3 shirokie 6560, 4 shyopot, 5 otryad,
;   6 klan, 7 armiya, 8 lavka, 9 krik lavki, 10 krik predmetom. 2046 = vse.
LogChannelMask=2046
; Ta zhe maska - na kakie kanaly deystvuet zaglushka. 2046 = vse.
MuteChannelMask=2046
; 1 = sessiya s GM-flagom ne glushitsya.
ExemptOperators=1
; Khranit' zhurnal N sutok (raz v sutki EXEC chat.UP_ChatJournalPurge). 0 = ne chistit'.
RetentionDays=90
; Raz v N s perechityvat' deystvuyushchie zaglushki (EXEC chat.UP_ChatMuteActive) v kesh. Novaya zaglushka - ne pozzhe N s.
MuteRefreshSec=15
; Rezhim notisa 3113 (+2). 101 = novyy klient Astory: stroka loc s chislom minut (atoi teksta); staryy klient -
;   tol'ko krasnaya stroka v lente chata. 0 = banner tekstom u vsekh klientov.
NoticeMode=101
; Tekst notisa (pusto = vstroennyy: '{min} min. - chat zablokirovan do {until} / Chat muted until {until}').
;   {min} - minut ostalos' (dolzhno byt' PERVYM pri NoticeMode=101), {until} - mestnoe vremya kontsa. Ne bol'she 95 bayt cp1251.
NoticeText=
; Tsvet notisa RGB (hex).
NoticeRgb=FF5050
; Ne chashche raza v N s odnomu igroku (otkaz soobshcheniyu - vsegda).
NoticeIntervalSec=3
; 1 = krik predmetom (FunctionItem 0x31/0x32) tozhe v zhurnal i pod zaglushku.
ShoutItemHook=1
; Stroki [P129] otkaza v PatchLog (pervye 50, dalee kazhdaya 500-ya).
RuntimeLog=1
; Emkost' ocheredi zhurnala (sobytiy). Perepolnenie - sobytie otbrasyvaetsya i schitaetsya, igra ne zhdyot.
QueueCapacity=16384
; Period zapisi paketa v bazu, ms.
FlushIntervalMs=2000
; Sobytiy v odnom pakete (<= 1000).
BatchMax=500
; Baza zhurnala (skhema chat).
Database=joylog1
; Otkuda GAMEDNS/GAMEUSER/GAMEPASS (kak u P53). Parol' v zhurnal ne pishetsya.
DbConfigFile=..\DBManager\DBMng.ini
; Baza nedostupna - pakety v Log\Log_ChatJournal\ChatJournal_<data>.sql.
FileFallback=1
; Kodovaya stranitsa teksta notisa 3113. Tol'ko odnobaytnaya (1250..1258); inache - 1251.
NoticeCodePage=1251
; Kodovaya stranitsa teksta bez UTF-8 i bez markera 0x98 (pravilo klienta Astory). Tol'ko odnobaytnaya; inache - 1251.
TextCodePage=1251
; Pauza mezhdu popytkami podklyucheniya k baze, s (1..3600).
ReconnectSec=30
; Strok v keshe zaglushek (16..16384); lishnie ne zagruzhayutsya (stroka v PatchLog).
MaxMutes=4096
; Taym-aut podklyucheniya, s (1..120).
LoginTimeoutSec=5
; Taym-aut zaprosa, s (1..600).
QueryTimeoutSec=15
; Ne bol'she N sobytiy v fayl v minutu (0 - bez predela, do 1000000).
FileRowsPerMinute=3000
; Potolok sutochnogo fayla, MB (0 - bez predela, do 4096).
MaxFileMB=256
; Pusto = DSN/login/parol' iz DbConfigFile (kak P53). Inache - polnaya stroka ODBC (parol' v zhurnal ne pishetsya).
ConnectionString=
; Sektsiya DbConfigFile s GAMEDNS/GAMEUSER/GAMEPASS.
DbConfigSection=DB_DNS0_0
; Imya istochnika v zhurnale (pusto = papka exe: GameServer / Indun_GameServer / Ch2_GameServer).
ServerName=
; Papka faylovogo zhurnala (pusto = <exe>\Log\Log_ChatJournal; otnositel'nyy put' - ot papki exe).
FileDir=

