;   в знаковое 16-битное поле. Без этого навык соулмейта перестаёт
;   завершаться, как только с начала каста прошло больше 32,7 с.
;   0 = оставить сток (каст «то работает, то нет» с периодом ~65 с).
CastTimerClamp=1
; * Дефект С4: ограничить чтение SoulmateSkill.ssi сотней записей —
;   ровно столько вмещает выделенный буфер. Файл длиннее 11 200 байт
;   в стоке пишет за конец кучи. Сейчас файл 5 040 б (45 записей),
;   то есть ключ — страховка на будущее расширение таблицы.
;   0 = оставить сток (без верхней границы).
SkillTableBounds=1

; * NASHA pravka (2026-09-11), reshenie vladeltsa: potolok urovnya igroka
;   59 -> MaxLevel (po umolchaniyu 100). V stoke 59 zashit konstantoy 0x3B
;   v SEMI funktsiyakh (opyt za moba/otryad/kuvshin, GetExpUpDownValue,
;   kuvshin partnyora, navyk soulmate 31, +2 ochka navykov).
;   Pravitsya tolko bayt imm8 v kazhdoy komande cmp.
;   Tablitsy ConfigSet uzhe dlinnee: ExpTable 151, ClassStat/Standard 100.
;   Dokument patcha: AstoryServer/Docs/GameServer/level-cap-100-p29.md
[P29_LevelCap]
; Главный выключатель секции. 0 = потолок 59, как в стоке (все 7 площадок
;   остаются стоковыми).
Enabled=1
; * Новый потолок уровня игрока (в стоке 59). Опыт идёт, пока уровень
;   МЕНЬШЕ этого числа, т.е. MaxLevel — последний достижимый уровень.
;   DLL сама зажимает его сверху длиной таблиц ConfigSet: ExpTable?1,
;   ClassStat/4, Standard, AppleExpLimit, SoulStoneExpLimit
;   (сейчас 150 / 100 / 100 / 151 / 151 ? предел 100) и 127.
;   Если таблица не читается — патч НЕ ставится, потолок остаётся 59.
;   ? Выше 100 без продления ClassStat.txt/Standard.txt подниматься нельзя:
;   сервер берёт из них характеристики по уровню.
MaxLevel=100
; * Кувшин души (партнёр должен быть ниже потолка, отказ 6) и навык
;   соулмейта 31 (отказ 29 на потолке) — тоже переводятся на MaxLevel.
;   0 = в этих двух местах остаётся 59 (кувшин и навык 31 перестанут
;   работать для игроков 59+, хотя опыт им уже положен).
SoulmateGates=1
; * +2 очка НАВЫКОВ за каждый уровень до MaxLevel включительно (имя ключа
;   историческое: это очки навыков CUser+0x19B, не характеристик).
;   0 = как в стоке: очки только до 59-го, уровни 60+ очков не дают.
StatPoints=1

; * NASHA pravka (2026-09-12), reshenie vladeltsa: chislo SLOTOV kart
;   23 -> MaxMaps. U GameServer pochti vsyo po kartam dinamicheskoe
;   (MapInfo.txt, MapWarpCost.txt, NpcServer, ChannelManager), a zhyostko
;   zashit ROVNO ODIN massiv - "karta otkryta + imya" iz OpenMapInfo.ini:
;   23 zapisi po 0x33 b na VA 0x0060A880. Rastyanut ego nelzya - on vplotnuyu
;   k obektu CThreadManager (0x0060AD18), poetomu massiv PEREEZZHAET v bufer
;   samoy AsdaPatch.dll, a v 11 ploshchadkakh pravyatsya adres i schyotchik.
;   Karta bez zapisi ne imeet ni priznaka "otkryta", ni potoka - imenno
;   poetomu karta 23 ^MineWar^ na zhivom mertva.
;   ! Sam po sebe patch ^MineWar^ NE ozhivlyaet: u neyo tip karty 6, a potok
;   sozdayotsya tolko dlya tipov 0, 1 i 3, i eyo faylov (.sim/.svr/.npc/
;   _PortalConfig.Ini/_ConnectIP.ini) na servere net.
;   Dokument patcha: AstoryServer/Docs/GameServer/map-slots-30-p30.md
[P30_MapSlots]
; Главный выключатель секции. 0 = 23 слота карт и стоковый массив
;   на 0x0060A880, как в стоке (карты с номером 23 и выше мертвы).
Enabled=1
; * Сколько слотов карт заводить (в стоке 23, то есть номера 0...22).
;   DLL сама зажимает это число сверху ДВУМЯ пределами:
;     1) 30 - жёстко: столько записей в массиве Total_PortalConfig
;        внутри CUserManager (this+2656, 30 записей по 31 б). Он
;        индексируется НОМЕРОМ карты напрямую, а сразу за ним лежит
;        массив игроков - номер 30 и выше означал бы разбор чужой памяти;
;     2) числом строк в MapData_Info\MapInfo.txt - иначе у слота нет
;        записи в таблице карт, и включённая секция MAP_n читала бы
;        за концом этой таблицы.
;   => чтобы слотов стало больше, СНАЧАЛА добавьте строку в MapInfo.txt.
;   Если MapInfo.txt не читается - патч НЕ ставится, остаются стоковые 23.
;   Не забудьте расширить и матрицу MapData_Info\MapWarpCost.txt до N*N,
;   секции MAP_n в OpenMapInfo.ini, [MAX_INIT_THREAD] COUNT в
;   ConfigSet\ThreadInfo.ini (не меньше числа карт с Use=1) и записи в
;   PortalIP_Info\Total_PortalConfig.Ini - они идут ПО НОМЕРУ карты.
MaxMaps=30

