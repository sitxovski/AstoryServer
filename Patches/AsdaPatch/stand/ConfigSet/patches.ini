;   Dokument: AstoryServer/Docs/GameServer/admin-bridge-p127.md
[P127_AdminBridge]
; * 1 = most admin-tsentra: fonovaya nit' oprashivaet ochered' AsdaAdmin.adm.bridge_cmd svoim ODBC (login asda_bridge - tol'ko
;   EXECUTE adm.Bridge*), pishet prisutstvie (kto v igre) i pul's uzla; komandy vypolnyayutsya v niti karty igroka na obshchey
;   tochke UserTick 0x526CEB (stab P73). 0 = nichego ne stavitsya (stok).
Enabled=0
; 0 = tol'ko slushat': prisutstvie i ping; kick/announce/move - itog 'zhurnal' (status 6), nichego ne vypolnyaetsya.
; 1 = vypolnyat' komandy (kick 4101+ExceptionDisConnetUser, ob'yavlenie 3113, perenos 5055).
Mode=0
; Shag oprosa ocheredi, ms (100...5000).
PollMs=500
