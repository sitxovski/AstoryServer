;   dobavki (30) k shansu v stotysyachnyh - +0,03 p.p. vmesto +30% iz podskazki originala; podtip slota 3 ne sveryalsya.
;   Protokol ne menyaetsya (6103 kod 5 - shtatnyy otkaz stoka). Dokument: AstoryServer/Docs/GameServer/hatch-supplement-p111.md
[P111_HatchSupplement]
; * 1 = Recv_IncubatorReq (6102, uchastok 0x4556C3 6 b): znachenie predmeta slota 3 podtipa SupplementSubType umnozhaetsya na
;   SupplementScale (ne bol'she 100000 = 100%); chuzhoy podtip - otkaz 6103 kod 5. 0 = stok: znachenie 30 pribavlyaetsya k shansu
;   v stotysyachnyh kak est' (+0,03 p.p. vmesto +30%), podtip slota 3 ne sveryaetsya.
Enabled=1
; 1 = reshenie; 0 = tol'ko zhurnal ac.other 174/176 (stok: znachenie i otkaz ne menyayutsya).
Mode=1
