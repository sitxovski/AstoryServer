;   Klient Astory na 6039/6041 tol'ko zazhigaet/gasit znachok (bez stroki v chat).
;   Dokument: AstoryServer/Docs/GameServer/event-badge-all-p128.md
[P128_EventBadgeAll]
; * 1 = na takte igroka v mire (UserTick 0x526CEB) GameServer shlyot emu 6039 / 6041 (te zhe tela, chto stok shlyot operatoru),
;   kogda menyaetsya sostoyanie sobytiya Event.dat ego karty (tip 0 'dobycha i zoloto', tip 1 'opyt'): vkhod v mir, smena karty,
;   komanda 6038/6040, nachalo/konets okna po chasam servera. 0 = stok (znachok vidit tol'ko operator).
Enabled=1
