SecretFile=ConfigSet\admin_bridge.ini
; Drayver ODBC (32-bitnyy). Server/Database/Login - nizhe.
Driver=SQL Server
Server=127.0.0.1,1433
Database=AsdaAdmin
Login=asda_bridge
