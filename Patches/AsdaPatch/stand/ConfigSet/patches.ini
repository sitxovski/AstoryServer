; ===========================================================================
; AsdaReborn — патчи GameServer. Ставит AsdaPatch.dll (грузится через таблицу
; импорта GameServer.exe, ДО точки входа). Патчи применяются В ПАМЯТИ, файл
; GameServer.exe на диске остаётся чистым стоком.
;
; Правится при ОСТАНОВЛЕННОМ сервере, читается один раз при старте процесса.
; * Ваши правки НЕ ТЕРЯЮТСЯ: при обновлении DLL дописывает только НЕДОСТАЮЩИЕ
;   ключи и секции, существующие значения остаются как есть.
; Лог установки: Log\Log_Patch\PatchLog_<ГГГГММДД>.txt
; Описание: AstoryServer\Docs\GameServer\dll-loader-and-patches.md
; ===========================================================================
[General]
; Версия формата файла. Меняет только сама DLL при миграции.
Version=86
; * ГЛАВНЫЙ ВЫКЛЮЧАТЕЛЬ. 0 = не ставить НИ ОДИН патч (сервер работает как сток).
;   При создании файла стоит 0 — это проверка каркаса: сервер должен подняться
;   и создать PatchLog. После успешной проверки поставить 1.
MasterEnable=0
; Вести лог установки патчей.
LogEnabled=1

; === ПЕРЕНЕСЕНО ИЗ СТАРЫХ БИНАРНЫХ ПРАВОК ==================================

; Приём клиентского опкода 6616 (в стоке обработчика НЕТ) -> ретрансляция 6131
; всем игрокам сервера = анонс редкой добычи.
; Проверки: индекс -> анти-реплей (Secret) -> MD5-подпись тела -> CUser -> код.
; Имя игрока берётся С СЕРВЕРА (CUser+376), поле имени из пакета игнорируется.
[P01_RareItemNotice6616]
Enabled=1

; Клиентский опкод 6030 (в стоке — мёртвый Send_ScreenShotCommand) превращён в
; GM-команду "объявление": тело пакета (+0x18) -> sendNoticeClient -> 3113 ВСЕМ.
; Гейт по флагу оператора (sub_52ED50).
; * В нашей реализации исправлена мина оригинальной бинарной правки: там ecx
;   читался из НЕинициализированного [ebp-4] (пролог делал push ecx, но не
;   mov [ebp-4],ecx). Работало по счастливой раскладке стека вызывающего.
[P02_GmNotice6030]
Enabled=1

; Диагностика: при операторской выдаче скиллпоинтов пишет строку
; "SKILLPOINT: user=%d now=%d" в Log_Operator. Логику игры не меняет.
[P03_OperatorSkillPointLog]
Enabled=1

; Режим "неуязвимость" — только оператору (в стоке мог включить любой игрок).
; ! Отключение этого патча ОСЛАБЛЯЕТ защиту.
[P04_InvincibleGmGate]
Enabled=1

; Премиум-гача: добавленная отправка (sub_4F60E0, буфер 0x78, код 105).
; ! Назначение — гипотеза (см. док), байты перенесены 1:1 с живого сервера.
[P05_PrimiumGachaExtraSend]
Enabled=1

; sub_4F6650: отправка DB-пакета 2601 (120 б) при выполнении условия в ветке.
; ! Назначение — гипотеза, байты перенесены 1:1.
[P06_Db2601Send]
Enabled=1

; sub_43C690: если поле CUser+0x3BC3D не ноль (неуязвимый/GM) — вернуть 1 сразу.
; ! Назначение — гипотеза, байты перенесены 1:1.
[P07_Sub43C690EarlyExit]
Enabled=1

; !! ЭТО ОБХОД, А НЕ ФИКС. Char_FunctionItem_Use: снята проверка (вызов+тест
;    заменены на "результат = 1"). Правка ЧУЖОГО происхождения, найдена дифом
;    живого сервера; автор и мотив в проекте не зафиксированы.
;    1 = поведение как сейчас на живом сервере (ничего не меняем).
;    Отключение (0) ВЕРНЁТ штатную проверку — использование функциональных
;    предметов начнёт отваливаться там, где обход её глушил. Менять только
;    осознанно и с проверкой на игроках.
[P08_FunctionItemUseCheckOff]
Enabled=1

; * NASHA pravka (audit 2026-08-17), a ne perenos chuzhoy.
;   Char_FunctionItem_Use (5450): kod predmeta iz paketa ispolzovalsya kak indeks
;   Function_Table BEZ proverki diapazona - shest obrashcheniy podryad. Proizvolnyy
;   kod v pakete uvodil chtenie za granitsy massiva i RONYAL GameServer odnim paketom.
;   Patch proveryaet kod shtatnoy sub_532B10 (1..chislo zapisey Function_Table.txt) i
;   pri vyhode za diapazon otvechaet shtatnym otkazom, kak sosednyaya proverka.
;   1 = zashchita vklyuchena (rekomenduetsya). 0 = vernut uyazvimoe povedenie originala.
[P15_FunctionItemCodeBounds]
Enabled=1

; * NASHA pravka (2026-08-18), a ne perenos chuzhoy.
;   Priz premium-gachi ranshe ostavalsya v premium-spiske BD: patchi P05+P06
;   vedut gachu po marshrutu premium-SHOPA (DB 2601), a on po zamyslu avtorov
;   v inventar nichego ne kladet. Otvet 6578 uhodil s konteynerom 0 i slotom -1
;   (znacheniya konstruktora zapisi sub_40A9F0), poetomu 6581 vsegda poluchal 10.
;   Patch dodelyvaet marshrut formuloy RABOCHEY vetki servera
;   Recv_PremiumItemToInven_Req: sub_5340B0 (zapis + konteyner) -> sub_4D6740
;   (svobodnyy slot) -> DB 2604; otvet 2605 obrabatyvaet stokovyy sub_4F89D0.
;   Dopolnitelno yacheyka vpisyvaetsya v telo 6578, chtoby klient videl priz.
;   1 = priz padaet v inventar (rekomenduetsya).
;   0 = kak sechas: priz ostaetsya v premium-spiske, igrok tyanet ego vruchnuyu.
[P16_GachaPrizeToInven]
Enabled=1

[P12_DefaultServerIp]
; Строка IP по умолчанию в .rdata (в стоке 61.106.140.206).
; Максимум 15 символов. Пустое значение = не трогать.
Value=127.0.0.1

; === НОВОЕ ================================================================

; Верхняя граница индекса сектора в Send_SectorInAddMonsterInfo и
; Send_SectorInNewAddMonsterInfo: в стоке проверяется только ">= 0", индекс
; больше числа секторов читает указатель за границей кучи -> крэш GameServer.
[P10_SectorIndexBoundsGuard]
Enabled=1

; Серверные источники анонса 6131 — сервер решает сам, клиенту не доверяем.
[P11_ServerAnnounceSources]
; Подбор редкого предмета с земли (грейд >= 3):
PickupEnabled=1
; Гача-коробка/бустер (грейд >= 3). Анонсируется ВЫИГРЫШ, не коробка.
GachaEnabled=1
; Премиум-гача (грейд >= 3). ! Код награды приходит от клиента.
PremiumGachaEnabled=1
; Заточка. Грейд НЕ требуется — анонсируем любую экипировку.
RefineEnabled=1
; * ПОРОГ анонса — по СТУПЕНИ улучшения (item+24, диапазон 0..20).
;   Ступень игроку не показывается, но считать порог удобнее по ней.
;   (старый ключ RefineThreshold больше НЕ читается)
RefineThresholdLevel=6
; Доп. порог по ПРОЦЕНТУ (item+27 — то, что игрок видит как "+N%").
;   0 = не учитывать. Если задан — анонс только когда выполнены ОБА порога.
RefineThresholdPercent=0
; Анонс НЕУДАЧИ: после зелёного анонса успеха следующая ПРОВАЛЬНАЯ попытка
;   улучшить ТОТ ЖЕ предмет объявляется красной строкой. Одна красная строка
;   на один зелёный анонс — после выдачи состояние снимается.
RefineFailEnabled=1
; 1 = красная строка только ПОСЛЕ зелёного анонса ТОГО ЖЕ предмета
;     (штатное поведение: одна красная на одну зелёную).
; 0 = анонсировать ЛЮБУЮ неудачу по предмету, ступень которого уже >=
;     RefineThresholdLevel, даже если зелёного анонса до этого не было.
;     Ставьте 0, если ждёте анонс провала на УЖЕ прокачанном предмете.
RefineFailRequiresPriorSuccess=1
; Срок годности взведённого состояния, секунд. Страхует от того, что номер
;   слота игрока после выхода займёт другой персонаж.
RefineFailWindowSec=600
; Зона рассылки: 0 = все игроки сервера, 1 = только сектор.
Scope=0
; Таблица кодов "анонсируемых" предметов (грейд >= 3 и подходящий тип).
; Путь относительно папки GameServer. Генерируется скриптом
; AstoryServer\Patches\AsdaPatch\tools\gen_announce_codes.py. Если файла нет — источники
; подбор/гача/премиум-гача НЕ анонсируют (защита от спама).
GradeTableFile=ConfigSet\announce_codes.txt

; «Широкие» каналы чата «Поиск отряда» (1) и «Торговля» (2). Клиент шлёт их
; опкодом 6560 и ждёт рассылку 6561; в стоке обработчика 6560 НЕТ ВООБЩЕ —
; пакет уходил в общую ветку default и только копил счётчик «мусорных»
; пакетов клиента. Патч перехватывает default диспетчера, разбирает 6560 и
; рассылает 6561 ВСЕМ онлайн-игрокам сервера — тем же циклом и теми же
; фильтрами онлайна, что у глобального чата 5086/5087.
; Серверного антифлуда нет намеренно: его нет и в 5086; ограничение частоты
; стоит на клиенте (кулдаун канала + антиповтор).
[P13_ChatWideChannels6560]
Enabled=1
; * Битовая маска ОБСЛУЖИВАЕМЫХ каналов, значение ДЕСЯТИЧНОЕ (бит N = канал N):
;     бит 0 (=1)  канал 0 «По всем каналам» — из клиента УБРАН, по умолчанию ВЫКЛ;
;     бит 1 (=2)  канал 1 «Поиск отряда»;
;     бит 2 (=4)  канал 2 «Торговля».
;   6 = 2|4 = только «Поиск отряда» и «Торговля» (штатное значение).
;   Каналы вне маски отвергаются со строкой в логе, ничего не рассылается.
AllowedChannelMask=6
; Повторять гейт глобального чата: если тип карты этого сервера = 4
;   (таблица настроек серверов, запись +0x3F), широкий чат не работает —
;   ровно так ведёт себя оригинальный recvGlobalChatClient (5086).
;   0 = обслуживать широкие каналы даже на таком сервере.
RespectServerMapTypeGate=1
; Пересылка сообщения на ЛОГ-СЕРВЕР чата (пакет 3670, запись 106 б) — то же,
;   что делает хвост обработчика 5086. Значение = код ТИПА чата в записи.
;   У глобального чата это 7; для широких каналов код в оригинале НЕ ЗАДАН,
;   поэтому по умолчанию 0 = НЕ отправлять (не выдумываем константу).
;   Поставьте нужный код, если лог-сервер должен видеть эти сообщения.
ChatLogType=0
; Писать строки [chat6560] (приём, отказы, рассылка) в PatchLog.
;   Это диагностика; при большом трафике можно выключить (0).
RuntimeLog=1

; Длина сообщения чата 80 -> 160 байт И ЗАКРЫТИЕ ТРЁХ ПЕРЕПОЛНЕНИЙ СТЕКА.
; !! В стоке обработчики 5084, 5086 и 4120 копируют тело пакета в стековый
;    char[80] БЕЗ проверки длины (проверка `<= 80` стоит НИЖЕ, уже после
;    memcpy): модифицированный клиент кладёт туда до ~690 байт и затирает
;    кадр стека вплоть до адреса возврата. Плюс длина считается знаковой —
;    короткий пакет даёт отрицательное значение (memcpy получает ~4 ГБ).
;    Патч зажимает длину ДО копирования и переселяет текстовый буфер в
;    собственные 256 байт на дне кадра. ЭТО ФИКС БЕЗОПАСНОСТИ — держать
;    включённым даже если увеличение длины не нужно (см. FixOverflowOnly).
; Затрагиваемые функции стока: 0x5471A0 (5084), 0x547670 (5086),
;    0x403F50 (4120), 0x547BD0 (5088), 0x450FB0 (5105), 0x547EB0 (доставка
;    шёпота -> 5089), 0x451210 (доставка чата отряда -> 5106).
[P14_ChatMessageLength]
Enabled=1
; * МАКСИМАЛЬНАЯ ДЛИНА текста сообщения чата В БАЙТАХ (текст cp1251,
;   один символ = один байт). В стоке 80, значение по умолчанию 160 = «вдвое».
;   Действует на каналы: 5084 общий/крик, 5086 глобальный, 4120 клан,
;   5088 шёпот, 5105 отряд, а также на 6560 «Поиск отряда»/«Торговля» (P13).
;   ! ПОТОЛОК 199: столько принимает RelayServer (буферы 200 б, проверки
;     1..199/1..200 в обработчиках 4121 и 3107). Больше ставить НЕЛЬЗЯ.
;   ! Клиентское поле ввода должно быть ограничено НЕ БОЛЬШЕ этого числа
;     (наш порт ставит 136 при MaxTextLen=160; оригинальный клиент — 68).
;   ! Канал армии/фракции (6718) НЕ затронут и остаётся на 80 байтах:
;     его пересылка 6719 имеет фиксированную длину 101 и подпись MD5.
;   ! Запись чата на лог-сервер (пакет 3670, 106 б) в любом случае
;     содержит первые 80 байт — формат записи фиксирован.
MaxTextLen=160
; 1 = ТОЛЬКО закрыть переполнения стека, предел оставить стоковым (80).
;   Режим для случая «клиент ещё не обновлён, но дыры закрыть надо».
;   MaxTextLen при этом игнорируется.
FixOverflowOnly=0
; Писать в PatchLog строки [chatlen] * OVERFLOW BLOCKED — они появляются
;   ТОЛЬКО когда клиент заявил длину больше предела (модифицированный
;   клиент или рассинхрон лимитов). Флуд лога ограничен автоматически.
RuntimeLog=1

; ? Русский текст в базе. Ставится НЕ в GameServer, а в процессах, которые
;   ходят в базу: DBManager, RelayServer (оба), LoginManager, OperationServer.
; Симптом: подпись игрока, чат в журнале, имена персонажей, названия кланов
;   и клички питомцев сохранялись как вопросительные знаки.
; Причина: базы игры арабские, а запрос везёт текст обычным литералом; перед
;   отправкой он переводится в Юникод по кодовой странице МАШИНЫ (1251),
;   и база, приводя литерал обратно к своей (1256), теряет кириллицу.
; Лечение: подставить в этом переводе 1256 — ту же, что у базы. База, схема,
;   процедуры и уже записанные данные НЕ трогаются вовсе.
; Разбор: Reports/dbmanager_string_path.md
[P17_SqlCodePage]
Enabled=1
; Кодовая страница, в которой текст запроса переводится в Юникод перед
;   отправкой в базу. Должна СОВПАДАТЬ с кодировкой базы, иначе символы,
;   которых в ней нет, превращаются в вопросительные знаки. Базы игры
;   арабские (Arabic_CI_AS = 1256), а машина сервера стоит на 1251 —
;   отсюда и потеря всего русского. 1256 обратима для всех 256 байт,
;   поэтому байты доходят до столбца нетронутыми: и русские, и арабские.
;   Менять только вместе с кодировкой базы.
CodePage=1256
; Подменять кодовую страницу только у строк, начинающихся с EXEC —
;   все 23 шаблона запросов начинаются именно так. Страховка на случай,
;   если через ту же точку пойдёт что-то постороннее. 0 = снять условие.
RequireExecPrefix=1

; * NASHA pravka (2026-08-27), a ne perenos chuzhoy. Sklad (StoreHouse).
;   Reversirovano zanovo po dekompilu i po ZHIVOMU obrazu GameServer.exe -
;   vse 14 ploshchadok bayt-v-bayt sovpali. Otchet: Reports/warehouse_net_server.md
;   Dokument patcha: AstoryServer/Docs/GameServer/warehouse-dupe-and-bounds-p18.md
;   Kazhdyy defekt vklyuchaetsya otdelnym klyuchom - mozhno stavit po odnomu.
[P18_WarehouseDupeAndBounds]
; Главный выключатель секции. 0 = не ставить НИ ОДНО из исправлений ниже.
Enabled=1
; * D4 — ДЮП. CharItemKeeping@0x5094A0: ветка-ловушка, пишущая в лог
;   "CharItemKeeping(11)", отправляет клиенту 5009 с кодом 5 (отказ) и НЕ
;   делает return — операция всё равно доходит до DB-запроса 2029. Клиент
;   уже получил отказ и предмет из лотка не убрал, потом приходит второй
;   5009 с кодом 1 (успех). 1 = возвращаться сразу после отказа.
FixKeepingDupe=1
; * D2 — ЧТЕНИЕ ЧУЖОЙ ПАМЯТИ. Send_ClientStoreHouseItemInfo (опкод 4050) при
;   номере страницы 0 читает 1710 байт ДО начала массива склада (CUser+6342)
;   и отправляет их клиенту пакетом 4051. Штатный клиент шлёт 1..9, но
;   собранный вручную пакет даёт утечку памяти. 1 = страница 0 отклоняется.
FixPageRange4050=1
; * D18 — при отказе на 4050 сервер не отвечал НИЧЕГО, а клиент снимает свой
;   флаг "запрос в полёте" только по 4052 — склад залипал до перезахода.
;   1 = отправлять штатный 4052 (конец страницы, 0 предметов).
FixReply4050OnReject=1
; * D9 — МЁРТВАЯ ПРОВЕРКА ГРАНИЦ в трёх загрузчиках контейнеров из ответа БД:
;   написано "slot < 0 && slot > N" (невыполнимо) вместо "|| ". Проверки нет,
;   любой slot из строки БД пишет 57 байт по CUser + 57*slot + база.
;   Площадки: 0x5296AC (инвентарь, 30), 0x529826 (второй мешок, 60),
;   0x52994F (СКЛАД, 270). 1 = проверка начинает работать.
FixDbSlotBounds=1
; * D13 — CharItemMove (опкод 5000) сверяет ячейку склада с зашитыми 270
;   (потолок массива), а не с ёмкостью КОНКРЕТНОГО игрока (CUser+0x1AE).
;   Игрок с ёмкостью 30 мог переложить предмет в ячейку 269 — 4050 её
;   никогда не отдаст, предмет становится невидимым и недоступным.
;   1 = граница берётся из ёмкости игрока (при её порче — стоковые 270).
FixMoveCapacity=1
; * D15 — шесть сочетаний тип-источника/тип-приёмника в CharItemMove
;   заканчиваются "return 0" без единого пакета (в т.ч. источник 1 или 2 +
;   приёмник 5 = склад). Клиент на 5000 ставит UI-замок и снимает его только
;   по 5001 — интерфейс залипал намертво. 1 = отвечать штатным отказом
;   "5001, код 2" (та же ветка, что у всех прочих отказов этой функции).
;   Ни одна ранее РАБОТАВШАЯ операция не затрагивается: во все шесть точек
;   попадают только сочетания, которые сервер и так отказывался выполнять.
FixMoveSilentReject=1

; * NASHA pravka (2026-08-27), a ne perenos chuzhoy. Auktsion (CItemMediation,
;   okno EXCHANGE_WIN 13000, opkody 9905 kupit i 9909 snyat lot).
;   Proverka chisla zapisey stoit POSLE memcpy 45 bayt - devyataya (odinnadtsataya)
;   zapis lozhitsya za konets stekovogo bufera i zatiraet sosedniye peremennye kadra.
;   Verkhnego predela dliny paketa net vovse (sub_5218A0 - tolko kratnost 45).
;   Reversirovano po dekompilu I po ZHIVOMU obrazu GameServer.exe - sovpalo bayt v bayt.
;   Otchet: Reports/npc_exchange_win_13000.md (S3, S4)
;   Dokument patcha: AstoryServer/Docs/GameServer/auction-record-bounds-p19.md
;   S1 iz togo zhe otcheta OPROVERGNUT, S6 zhivet v ItemRelayServer (defekt DANNYKH).
[P19_AuctionRecordBounds]
; Главный выключатель секции. 0 = не ставить НИ ОДНО из исправлений ниже.
Enabled=1
; * S3 — 9905 «КУПИТЬ» (Recv_TransAction_BuyItemReq@0x51AA10). Цикл разбора
;   хвоста пакета копирует запись в 45 байт в стековый буфер на 8 записей
;   И ТОЛЬКО ПОТОМ сверяет счётчик. Девятая запись ложится за конец
;   буфера и затирает соседние переменные кадра, в том числе 15-байтную
;   шапку запроса, уходящую в ItemRelayServer. Верхнего предела длины
;   пакета нет вовсе — sub_5218A0 проверяет только кратность 45.
;   1 = проверка идёт ДО копирования. Штатный путь НЕ меняется:
;   ровно 8 записей по-прежнему принимаются, а отказ уходит тем
;   же штатным ответом 9906 с кодом 1, что и в стоке.
FixBuyRecordBounds=1
; * S4 — 9909 «СНЯТЬ ЛОТ» (Recv_TransAction_DeleteItemReq@0x51E380). То же
;   самое с пределом 10: одиннадцатая запись пишет 35 байт за конец
;   объявленного массива. 1 = проверка идёт ДО копирования, отказ —
;   штатный ответ 9910 с кодом 1.
FixDeleteRecordBounds=1
; * S1 — ДИАГНОСТИКА, НИЧЕГО НЕ МЕНЯЕТ. Отчёт утверждал, что сверка
;   подписи тела пакета (sub_523F00@0x523F00) отключена. В ЖИВОМ образе
;   она РАБОТАЕТ (0x523F8B = 74, 0x52400D = 74); EB стоит только в нашей
;   локальной копии со снятой защитой — оттуда и ошибка в отчёте.
;   1 = напечатать фактическое состояние обеих площадок в PatchLog.
ReportMd5GateState=1

; * NASHA pravka (2026-08-29), a ne perenos chuzhoy. Zvaniya (Fame), okno 18700.
;   Maska slavy byla ROVNO 256 bit i u klienta, i u servera, poetomu zvaniya
;   s id 256…279 (ikh 24 v title_list) byli nedostizhimy - bita dlya nikh net.
;   Rasshireno do 512 bit. Format paketov 6066/6086 SAMOOPISATELEN PO DLINE:
;   staraya chast na meste, +32 bayta dopisany V KHVOST, staryy klient ikh
;   prosto ne zamechaet. Obratnoye napravleniye (6067/6069) ne menyalos.
;   Ploshchadki svereny s ZHIVYM obrazom GameServer.exe - raskhozhdeniy 0.
;   Otchet: Reports/title_mask_512.md
;   Dokument patcha: AstoryServer/Docs/GameServer/title-mask-512-p21.md
[P21_TitleMask512]
; Главный выключатель секции. 0 = сервер остаётся на 256-битной маске славы,
;   то есть звания с id 256 и выше получить нельзя (как в стоке).
Enabled=1
; * Предел числа записей ConfigSet\FameInfo.txt: 256 -> 512
;   (загрузчик sub_4A18F0@0x4A18F0, отказ «FameInfo count over»).
;   ? Сам по себе НИЧЕГО не даёт: во всех трёх функциях работы с битами
;   стоит гейт «id < число записей», поэтому таблицу надо ещё и ДОРАСТИТЬ
;   (на живом в ней 251 запись, id 0…250; клиентская title_list знает 280).
RaiseFameInfoCap=1
; * Хранилище битов 256…511. В CUser места нет: маска «получено»
;   (CUser+0x17DDC) и маска «найдено» (CUser+0x17E00) разделены указателем
;   на массив записей званий, нарастить их на месте нельзя. Поэтому массив
;   записей (operator new(44*N) @0x4A2824) выделяется на 64 байта длиннее:
;   32 байта — старшая половина «получено», 32 — старшая половина «найдено».
;   0 = хранить биты негде, все остальные части секции гаснут автоматически.
AllocHighMaskTail=1
; * Операции над битами 256…511 в CheckFameBit@0x54A890, AddFameBit@0x54A980
;   и SubFameBit@0x54AD00. Трамплин стоит на ВХОДЕ: при id < 256 доигрывает
;   вытесненный пролог и уходит в СТОКОВЫЙ код байт в байт, так что штатные
;   звания не задеты вовсе.
;   ? В базу биты 256…511 НЕ сохраняются: DB-пакеты 2256/2257/2266 несут
;   ровно 4 qword, а принимает их DBManager. До правки базы такое звание
;   живёт до перезахода персонажа.
HighBitOps=1
; * Пакет 6066 «маска получено» уходит клиенту расширенным: 42 -> 74 байта,
;   [42..73] = биты 256…511. Старая часть НЕ сдвинута, поэтому НЕ обновлённый
;   клиент читает свои 42 байта и хвост просто не замечает.
Extend6066=1
; * Пакет 6086 «маска найдено»: 38 -> 70 байт, [38..69] = биты 256…511.
;   ? У 6086 порядок полей обратный к 6066 (сначала charId) — так в стоке.
Extend6086=1
; * Обмен старшей половиной с базой (пара к патчу DBManager P22).
;   При входе персонажа уходит опкод 2330 «дай старшую половину», ответ
;   2332 наполняет её и догоняет клиента расширенными 6066/6086; при
;   выдаче и снятии звания id >= 256 уходит 2331 «сохрани».
;   Существующие DB-пакеты 2256/2257/2266 не тронуты — они несут ровно
;   4 qword, удлинять их нельзя.
;   ? Требует патча DBManager (P22) и SQL-миграции
;   (SQL/title_mask_512_01_migrate.sql). БЕЗОПАСНО включать и раньше них:
;   необновлённый DBManager этих опкодов просто не знает — все три
;   диапазона его switch дают переход в эпилог, обработчика нет,
;   ошибки нет. Просто звание id >= 256 не переживёт перезаход.
;   0 = не ходить в базу вовсе (старшая половина живёт до перезахода).
DbHighExchange=1

; * NASHA pravka (2026-08-30). Reytingovye zvaniya (Group==1, id 65…69):
;   "max uroven na servere / sredi voinov / luchnikov / magov / bolshe zolota".
;   V ORIGINALE SNYATIYA U PREZHNEGO LIDERA NET VOOBSHCHE: SubFameBit@0x54AD00
;   zovyotsya tolko iz DeleteFameInfo po klientskomu 6069, a zvaniye Group==1
;   klient udalyat ne dayot (notis 2428) - vydannoye ostavalos NAVSEGDA.
;   Chinim v priyomnike 3404…3408 sub_54D710@0x54D710: bayt-flag zapisi
;   (v stoke MYORTVYY) teper znachit 0=vydat, 1=snyat.
;   Otpravitel smeny lidera i snyatiye u OFFLAYN-igroka - storona bazy
;   (patch P23 v DBPatch.dll, tablitsa dbo.FameRatingHolder).
;   Dokument patcha: AstoryServer/Docs/GameServer/fame-rating-revoke-p24.md
[P24_FameRatingRevoke]
; Главный выключатель секции. 0 = приёмник 3404…3408 остаётся стоковым:
;   звание только ВЫДАЁТСЯ и не снимается никогда (дефект оригинала).
Enabled=1
; * Площадка 0x54D86F. Две беды стока разом:
;   1) игрок ищется ТОЛЬКО по подсказке userNum из пакета, а userNum —
;      номер живой сессии, стороне базы он неизвестен. Теперь при
;      userNum = 0xFFFF (или при несовпадении UserIndex) сервер ищет сам,
;      перебором таблицы сессий «менеджер+0x40+4*n», предел 550;
;   2) при ненайденной сессии сток делал не «следующая запись», а ВЫХОД
;      ИЗ ВСЕГО ПАКЕТА — один офлайн-игрок в списке съедал выдачу всем
;      остальным. Теперь запись просто пропускается.
ResolveByUserIndex=1
; * Площадка 0x54D8B7. Флаговый байт записи (+12), в стоке МЁРТВЫЙ
;   (читается в [ebp-0x2C] и больше нигде), получает смысл:
;     0 — ВЫДАТЬ звание (стоковый блок повторён байт в байт);
;     1 — СНЯТЬ звание у прежнего лидера.
;   Новых опкодов не заводится: снятие и выдача едут одним пакетом.
RevokeOnFlag=1
; * Если снимаемое звание было НАДЕТО — снять и активное: обнулить слот
;   (CUser+0x17E20, шаг 38 б, 2 слота), снять шесть бонусов через
;   sub_54D210 с признаком 0 и отправить в базу 2258 (12 б).
;   Ровно то, что делает DeleteFameInfo по клиентскому 6069.
ClearActiveTitle=1
; * Разослать 6068 (14 б) владельцу и окружающим по сектору, чтобы плашка
;   над головой обновилась у всех, кто рядом. ? Дефект оригинала:
;   DeleteFameInfo активный слот обнуляет, а 6068 НЕ шлёт вовсе —
;   снятое звание висело над головой до смены карты.
BroadcastPlate=1
; * Отправить владельцу обновлённые маски 6066 «получено» и 6086 «найдено»
;   СРАЗУ. ? Дефект оригинала: 6066 уходит клиенту ровно в одном месте —
;   recvDBUserFameBitInfo@0x54BD10, то есть только при входе в игру.
;   Без этого ключа снятие доехало бы до клиента лишь после перезахода.
;   Длина тела берётся у P21 (42/74 и 38/70 б) — общая точка.
PushMaskToOwner=1
; * ДИАГНОСТИКА. Каждый приход опкодов 3404…3409 и разбор КАЖДОЙ записи
;   пишутся в штатный журнал сервера Log/Log_Title/Title_ГГГГММДД.txt —
;   туда же, где AddFameBit печатает «Add Before/After Title».
;   Строки: «P24 RECV op/len/N/rem» (вход приёмника, ДО всех гейтов),
;   «P24 REC #n title/flag/userIdx/slotRaw/userNum/val -> как найден»,
;   «P24 GRANT title/userNum». ? Именно молчание этого места 30.08
;   скрыло, почему выдача не доезжает. Оставлять включённым.
;   0 = не писать и НЕ ставить площадку на входе sub_54D710.
LogRecv=1
; * Отправить владельцу 6070 (13 б) «звание удалено», код 1.
;   ??? Это и есть «ультимативное снятие»: обработчик живого клиента
;   @0xE9BE80 при коде 1 снимает бит и правит очки БЕЗУСЛОВНО, а окно
;   званий 18700 перерисовывает только если оно открыто. То есть звание
;   забирается, даже когда игрок окно не открывал и не перезаходил.
;   0 = не слать (маску всё равно поправит 6066).
Notify6070=1

; * NASHA pravka (2026-08-30). GM-komanda "pereschitat reytingi SEYCHAS".
;   Pereschyotov TRI, i vse tri v originale tolko po raspisaniyu:
;     1) usloviya VSEKH zvaniy - v originale periodicheskoy proverki NET
;        voobshche (TimerProcess trogaet rovno odno zvaniye, id 22);
;     2) zvaniya 65…69 - nash P23 (DBPatch.dll), taymer IntervalSec = 600 s;
;     3) mesto v tope po ochkam slavy - stokovyy EXEC UPTopFamePoint ->
;        opkod 3409, zadacha ChannelManager "Title Rank Process" v 03:00.
;   Ruchnoy zapusk (3) v originale est, no TOLKO s konsoli ChannelManager
;   (stroka 'o' : Title Rank Process v obraze) - iz igry nedostupen.
;   Komanda prinimaetsya MYORTVYM operatorskim keysom 0x1784 (opkod 6020):
;   v stoke etot case ne delaet NICHEGO, tolko pishet dva markera progressa.
;   Rezhim zadayotsya pervym baytom payload: 0=vsyo, 1=65…69, 2=top slavy,
;   3=tolko usloviya vsekh zvaniy.
;   Dokument patcha: AstoryServer/Docs/GameServer/gm-rating-recalc-p25.md
[P25_GmRatingRecalc]
; Главный выключатель секции. 0 = опкод 6020 снова МЁРТВЫЙ, как в стоке
;   (сервер его принимает и молча выбрасывает), пересчёт только по
;   расписанию: звания — таймер P23, топ славы — 03:00 у ChannelManager.
Enabled=1
; * ? ОПЕРАТОРСКИЙ ГЕЙТ стока: sub_52ECF0 — UserIndex (CUser+0x174)
;   обязан быть в диапазоне 0…5000. Ровно эту проверку делают ВСЕ семь
;   стоковых операторских команд (Kick/Kill/Add/GetMob/EventSet/EventOff/
;   ItemGive). По ИМЕНИ судить нельзя: ADM_* — оператор, а GM_* может быть
;   обычным игроком. ? 0 ставить только для отладки: команда пересчитывает
;   всю базу и проходит по всем игрокам в игре.
RequireOperatorIndex=1
; * Вторая стоковая проверка: sub_52ED50 — байт GM-полномочий на CUser,
;   приезжает из dbo.CharGmInfo.GMFlag через UPCharGMInfo при входе.
;   Стоковые команды требуют ОБА признака, поэтому и мы требуем оба.
RequireGmFlag=1
; * Анти-тампер (sub_524390, монотонный счётчик) и MD5 тела (sub_523F00
;   с признаком 1 — конверт «секрет+MD5»). Как у всех GM-команд.
;   0 = не сверять (только для отладки собранным вручную пакетом).
CheckPacketSignature=1
; * Защита от злоупотребления: не чаще одного запуска в N секунд.
;   Здесь порог МГНОВЕННЫЙ — отказ выдаётся не сходив в базу вовсе.
;   Авторитетный порог живёт на стороне базы: dbpatch.ini,
;   [P23_TitleRankFeed] MinForceSec (он считает реальные проходы).
;   0 = не ограничивать здесь (порог P23 всё равно останется).
MinIntervalSec=60
; * ? ПЕРЕСЧЁТ УСЛОВИЙ ВСЕХ ЗВАНИЙ у тех, кто СЕЙЧАС В ИГРЕ. Обходим
;   список сессий теми же функциями, что стоковый TimerProcess@0x5431C0,
;   и по каждому званию зовём стоковую проверку sub_54B260@0x54B260
;   с признаком «в базу не слать» (иначе на каждое звание каждого игрока
;   улетал бы DB-пакет 2257). Уже полученные звания пропускает гейт
;   sub_54A890. Выданное сохраняется само — AddFameBit шлёт в базу 2256.
;
;   ??? ЧЕСТНО О ГРАНИЦАХ. В оригинале ПЕРИОДИЧЕСКОЙ проверки условий НЕТ
;   вообще: TimerProcess трогает ровно одно звание (id 22, время в игре),
;   всё остальное начисляется ТОЛЬКО по событию (sub_54A050, 204 вызова).
;   Поэтому пересчитать можно лишь то, чей прогресс ГДЕ-ТО ЛЕЖИТ. Разбор
;   всех 280 записей ConfigSet\FameInfo.txt:
;     92 — выключены колонкой 1 (не трогаем);
;     51 — колонка 45 = 1, универсальный накопитель  -> ПЕРЕСЧИТЫВАЕМО;
;     89 — стоковый switch, накопитель в записи       -> ПЕРЕСЧИТЫВАЕМО;
;      2 — id 29 и 45 (процент по маске игрока)       -> ПЕРЕСЧИТЫВАЕМО;
;      7 — id 5, 43 и 6…10 (живое поле CUser)         -> ПЕРЕСЧИТЫВАЕМО;
;      1 — id 22 (время в игре)                       -> ПЕРЕСЧИТЫВАЕМО;
;     25 — значение приходит В СОБЫТИИ и НИГДЕ не хранится -> НЕЛЬЗЯ;
;      1 — id 32: ветки накопления нет вовсе, значение всегда 0;
;     12 — нет ни одной ветки условия (в т. ч. рейтинговые 65…69,
;          их раздаёт отдельный пересчёт по пакетам 3404…3408).
;   ? Персонажи НЕ В ИГРЕ не охвачены: накопители лежат в CUser. Для них
;   нужна отдельная процедура базы — её контракт описан в документе патча.
;   0 = не проверять условия, оставить только рейтинговые и топ славы.
SweepAllTitles=1
; * Предохранитель: сколько званий разрешено выдать за ОДИН проход.
;   Каждая выдача — это нотис 6065 игроку и DB-пакет 2256, поэтому на
;   полном сервере первый прогон может дать заметный всплеск трафика.
;   Дойдя до предела, проход останавливается и пишет строку в журнал
;   Log_Operator; повторный запуск продолжит с того же места.
MaxGrantsPerPass=2000
; * Номер канала в теле стокового 6561, которым уходит ответ оператору.
;   Клиент красит строку по нему (0 = как обычное системное сообщение,
;   1 = «Поиск отряда», 2 = «Торговля»). Новых опкодов клиенту не нужно.
ReplyChannel=0

; * NASHA pravka (2026-08-30), BEZOPASNOST. Dva defekta servernoy chasti
;   soulmate iz otchyota Reports/soulmate_6400.md 12a.6:
;     S8 - CheckSoulMateSkillCastingTime@0x497440: raznost "proshlo s
;          nachala kasta" schitaetsya 32-bitno, no SOKHRANYAETSYA v
;          znakovoye 16-bitnoye pole. Posle 32767 ms znacheniye stanovitsya
;          otritsatelnym i kast navyka NIKOGDA ne zavershaetsya; dalshe
;          kartina povtoryaetsya s periodom 65536 ms. Lechim zazhimom 0x7FFF.
;          (V otchyote defekt opisan kak "16-bitnoye chteniye tika" -
;           dizassembler zhivogo obraza eto ne podtverdil, mekhanizm drugoy.)
;     S4 - zagruzchik SoulmateSkill.ssi (sub_4B3350@0x4B3350) vydelyaet bufer
;          strogo na 100 zapisey, a chitaet po razmeru fayla bez verkhney
;          granitsy: fayl > 11200 b pishet ZA KONETS kuchi. Izvne NE
;          ekspluatiruetsya (dlinu zadayot fayl na diske). Seychas fayl
;          5040 b = 45 zapisey, defekt spyashchiy - stavim kak strakhovku.
;   Na tekushchikh dannykh OBA klyucha povedeniye NE menyayut.
;   Dokument patcha: AstoryServer/Docs/GameServer/soulmate-server-defects-p27.md
[P27_SoulmateServerDefects]
; Главный выключатель секции. 0 = обе площадки остаются стоковыми.
Enabled=1
