; Kletka igroka v prisutstvii obnovlyaetsya ne chashche, s (vkhod, karta, imya - srazu).
SnapshotSec=5
; Komanda, ne doshedshaya do takta igroka za stol'ko s, - itog 'net na servere' (status 4).
PendingSec=30
; Tip 4101 kika mosta: 0 'Default' (klient: notis 1002 'Server razorval soedinenie'). P48 ne zaschityvaet (kod 8).
KickType=0
; Komand za odin zakhvat (1...64).
ClaimMax=16
