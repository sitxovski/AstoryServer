; ===========================================================================
; AsdaReborn — патчи NpcServer. Ставит AddonNPC.dll (грузится через таблицу
; импорта NpcServer.exe, ДО точки входа). Патчи применяются В ПАМЯТИ, файл
; NpcServer.exe на диске остаётся чистым стоком.
;
; Правится при ОСТАНОВЛЕННОМ сервере, читается один раз при старте процесса.
; * Ваши правки НЕ ТЕРЯЮТСЯ: при обновлении DLL дописывает только НЕДОСТАЮЩИЕ
;   ключи и секции, существующие значения остаются как есть.
; Лог установки: Log\Log_Patch\PatchLog_<ГГГГММДД>.txt
; Описание: AstoryServer\Docs\NpcServer\dll-loader-and-patches.md
; ===========================================================================
[General]
; Версия формата файла. Меняет только сама DLL при миграции.
Version=7
; * ГЛАВНЫЙ ВЫКЛЮЧАТЕЛЬ. 0 = не ставить НИ ОДИН патч (сервер работает как сток).
;   При создании файла стоит 0 — это проверка каркаса: сервер должен подняться
;   и создать PatchLog. После успешной проверки поставить 1.
MasterEnable=0
; Вести лог установки патчей.
LogEnabled=1

; === ПЕРЕНЕСЕНО ИЗ БАЙТОВОГО ПАТЧА patch_npc_attack_timer32 ================

; Античит скорости атаки хранит момент последнего удара 32-битным, а сравнивает
; по младшим 16 битам. После паузы дольше ~65 с разность переполняется, удар
; МОЛЧА отбрасывается (ни урона, ни ответа клиенту), счётчик нарушений растёт,
; при 30 — отключение игрока. Симптом: «то атакует, то не атакует».
; Патч переводит вычисление в 32 бита. Порог 30 и счётчик нарушений НЕ меняются —
; античит продолжает ловить настоящее ускорение.
; ? Допуск: сток прощает 100 мс; AttackToleranceRate (%) — max(100 мс, % длительности),
; чтобы сетевые задержки и кадры не копили счётчик у честного игрока (обычная атака и PvP).
; Документ: AstoryServer\Docs\NpcServer\attack-speed-timer-16bit.md (раздел N16)
[N01_AttackTimer32]
Enabled=1
; ? Допуск проверки скорости атаки, ПРОЦЕНТ серверной длительности удара (решение владельца 15.10.2026).
;   Удар — нарушение, только если интервал короче длительности больше, чем на этот процент
;   (но не мягче стока: допуск не меньше 100 мс). 0 = как в стоке (ровно 100 мс). Предел 0…50.
AttackToleranceRate=15

; === ПЕРЕНЕСЕНО ИЗ БАЙТОВОГО ПАТЧА patch_npc_hate_clear_damage =============

; При возрождении монстра список угрозы чистится не полностью: накопленный урон
; в записи остаётся от прошлой жизни. А поиск владельца добычи сравнивает самую
; первую запись БЕЗ проверки, занята ли она. Итог: победителем может стать пустая
; запись с мусором, и опыт с добычей теряются либо уходят не тому.
; Патч добавляет обнуление этого поля в цикл очистки.
[N02_HateClearDamage]
Enabled=1

; === НАША ПРАВКА (не перенос) ==============================================

; Поиск владельца добычи сравнивает самую первую запись списка угрозы, НЕ
; проверяя, занята ли она вообще (у остальных девятнадцати — проверяет).
; Пустая запись с мусорным числом могла выиграть, и тогда опыт с добычей
; терялись либо уходили не тому игроку.
; N02 убрал ИСТОЧНИК мусора, этот патч закрывает саму дыру.
; ? Первая правка, сделанная врезкой: байтами она была невозможна — в секции
;   кода нет свободного места, площадка живёт в самой библиотеке.
[N03_HateWinnerEntry0]
Enabled=1

; === НАША ПРАВКА (не перенос) ==============================================

; Перед раздачей награды сервер выдерживает секундную задержку, но уводит на этой
; секунде обработку на ветку ЖИВОГО монстра — вместе с боевым искусственным
; интеллектом. Из-за этого монстр успевает ударить уже после смерти.
; Патч ставит на вызов боевого ИИ ровно тот же признак смерти, которым сама
; функция отличает мёртвого. Слив накопленного урона, тик состояний и сама
; задержка работают как прежде.
[N04_DeadMobNoBattle]
Enabled=1

; === НАША ПРАВКА (не перенос) ==============================================

; Сервер собирает поле здоровья монстра в двух пакетах по-разному: в одном
; вычитает накопленный, но ещё не применённый урон, в другом отдаёт как есть.
; Пока монстр «просыпается» после первой агрессии, его здоровье не меняется
; вовсе — весь урон копится отдельно. Поэтому один пакет показывал убывающее
; здоровье, а следующий полное: полоса скакала вверх и обратно.
; Патч приводит второй пакет к той же формуле, что уже применяется в первом.
; На стороне клиента этот же симптом обойдён прогнозом здоровья; обход оставлен
; намеренно — он защищает и от других путей.
[N05_Hp8202SubtractAccum]
Enabled=1

; === НАША ПРАВКА (не перенос) ==============================================

; Когда монстра бьют больше двадцати человек, список угрозы переполняется и
; сервер ищет, кого вытеснить. Пока подходящая запись не найдена, он берёт
; порог сравнения по адресу на шестнадцать байт РАНЬШЕ начала массива — то есть
; из чужого поля. Если там оказалось большое число, вытеснять становится некого,
; и новый участник боя в список не попадает: остаётся без опыта и добычи.
; Патч обновляет порог только тогда, когда кандидат уже найден.
; Та же последовательность встречается в функции трижды — правятся все три.
[N06_HateSearchOob]
Enabled=1

; === НАША ПРАВКА (не перенос) ==============================================

; Первые две секунды боя монстр «спит»: его здоровье не меняется, а урон копится
; отдельно. Если очередной удар покрывает весь остаток здоровья, сервер должен
; записать в накопитель ровно этот остаток — но вместо присваивания там сложение,
; и записывается «здоровье плюс урон».
; Клиенту здоровье уходит как разность здоровья и накопителя с зажимом в ноль.
; Раз накопитель заведомо больше — разность уходит в минус, зажимается в ноль, и
; полоса пустеет у монстра, который ещё жив и дерётся.
; Патч меняет сложение на присваивание: два байта, длина та же.
[N07_AccumOverkill]
Enabled=1

; === НАША ПРАВКА (не перенос) ==============================================

; Сервер шлёт здоровье монстра тремя разными каналами, и они расходились: один
; вычитал накопленный, но ещё не применённый урон, а два других отдавали здоровье
; как есть. Канал движения приходит десятки раз в секунду и каждый раз тянул
; полосу обратно вверх — отсюда отскоки посреди боя.
; Патч приводит и его к той же формуле. После этого все три канала несут одну
; величину, и «двух разных здоровий у одного монстра» больше нет.
[N08_Hp8005SubtractAccum]
Enabled=1

; === ДИАГНОСТИКА, НЕ ПРАВКА ================================================

; Ничего не меняет в расчёте. На КАЖДУЮ выдачу опыта печатает в этот журнал
; четыре числа: урон, записанный за игроком; максимум здоровья монстра;
; базовый опыт монстра; и что в итоге начислено.
; Нужна для разбора жалобы «иногда приходит опыт +1»: по этим числам сразу
; видно, какой из множителей падает.
; Включать НА ВРЕМЯ ЗАМЕРА и выключать обратно — записей много.
[N09_ExpProbe]
Enabled=0

; === НАША ПРАВКА (не перенос) ==============================================

; Опыт за монстра делится по накопленному урону. Урон от НАВЫКА в список
; участников боя попадал, а от ОБЫЧНОЙ АТАКИ — нет: она регистрировала только
; агрессию и передавала ноль вместо урона. Поэтому доля бившего обычной атакой
; оказывалась нулевой, а округление давало ровно 1 очко опыта.
; Патч дописывает нанесённый урон в список перед отправкой здоровья клиенту.
; Величина УГРОЗЫ не трогается — ранжирование списка остаётся прежним.
[N10_NormalAttackHateDamage]
Enabled=1

; === P39, НАША ДОРАБОТКА (не перенос) ======================================

; Скрытый оператор (GM hide, пакет 8115 от GameServer) должен быть невидим для
; монстров. Оригинал проверял признак скрытия только при выборе ПЕРВОГО
; агрессора; монстр, уже бившийся с оператором, продолжал гнаться и бить, навыки
; монстров задевали его, а после возрождения признак стирался.
; Enabled=0 — вернуть поведение оригинала целиком. Ключи ниже выключают части:
;   DropTarget      — монстр бросает скрытого, если тот был его целью;
;   SearchSkip      — поиск агрессора пропускает скрытого и ищет дальше;
;   SkillSkip       — навыки монстров не выбирают и не задевают скрытого;
;   PurgeHateOnHide — при скрытии он вычищается из списков угрозы монстров;
;   KeepOnRespawn   — после возрождения скрытый остаётся скрытым;
;   LogEvents       — строка в этом журнале на каждое скрытие/показ.
[N11_GmHideNpc]
Enabled=1
DropTarget=1
SearchSkip=1
SkillSkip=1
PurgeHateOnHide=1
KeepOnRespawn=1
LogEvents=1

; === ДОВОДКА P39, НАША ДОРАБОТКА (не перенос) ============================

; N11 чистит угрозу к скрытому оператору один раз — в момент скрытия. N12 не
; даёт ей появиться снова ни из какого источника (страж души, навыки, провокация,
; угроза лекарю, урон): гейт стоит в единственной функции добавления угрозы.
; И навык монстра по ОДНОЙ цели больше не задевает скрытого.
; Enabled=0 — поведение как с одним N11. Части:
;   BlockHate    — угроза к скрытому не добавляется;
;   SingleVictim — одиночный навык монстра не задевает скрытого;
;   LogEvents    — строки [N12] (первые 20 событий, дальше каждое 1000-е).
; Документ: AstoryServer\Docs\NpcServer\gm-hide-npc-p39.md (раздел N12).
[N12_GmHideHate]
Enabled=1
BlockHate=1
SingleVictim=1
LogEvents=1

; === ЛИМИТЫ БОЯ, сторона NpcServer (пара к P56; волна В5, мера 9 плана античита, 12.10.2026) ===
; Штатные отказы по дальности (удар по монстру вне коробки 3+дальность моба > 8204 код 1;
; PvP-удар дальше 4 клеток) дублируются в таблицу joylog1.ac.move_combat (виды 12/13).
; Частота ударов — штатная проверка NpcServer (N01 + журнал N13). Пороги стока НЕ меняются:
; это только журнал. Enabled=0 — площадки не ставятся. Требует P53_AcJournal Enabled=1.
; Документ: AstoryServer\Docs\NpcServer\combat-limits-n14.md
[N14_CombatLimits]
Enabled=1

