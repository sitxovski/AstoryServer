; LogDrop.ini — настройки службы AsdaLogDrop (рядом с AsdaLogDrop.exe). Неизвестный ключ = отказ запуска.
; Протокол и смысл лимитов: Reports/release_logs_2026-10-19/00_SPEC.md, README.md службы, REVIEW_security.md (В1–В3).
Port=8446
Root=@@ASTORY_SERVER_ROOT@@\Working_ASDA\v2\LogDrop
LogDir=@@ASTORY_SERVER_ROOT@@\Working_ASDA\v2\LogDrop\service\logs
KeyIds=@@ASTORY_LOGSEAL_KEY_ID@@
QuotaBytes=5368709120
QuotaWarnPercent=80
MinFreeBytes=2147483648
; один файл ≤ 4 МиБ; тело ≤ 4 МиБ + 64 КиБ (Caddy request_body max_size 4160KiB)
MaxBody=4259840
MaxFile=4194304
MaxFiles=1
; запросов в час (засчитываются все попытки; логин — только принятые с существующей учёткой)
PerIpPerHour=6
PerInstallPerHour=6
PerLoginPerHour=12
; бюджеты принятых байт (отказы не списываются); ★ 31.10.2026: 25/25/64 МиБ под части журнала сессии (ротация клиента) — выложено на dev
IpBytesPerHour=26214400
InstallBytesPerHour=26214400
LoginBytesPerDay=67108864
UnknownBytesPerDay=268435456
GlobalBytesPerDay=1073741824
; одновременно: 4 приёма всего, 1 на IP; срок тела 55 с (< Caddy read_body 60s / write 70s)
MaxConcurrent=4
MaxConnections=32
HeadTimeoutMs=10000
BodyTimeoutMs=55000
IoTimeoutMs=5000
AccountCacheMinutes=10
; ★ В6: вход SQL по паролю (служба с sidtype restricted; SSPI под ним не работает). Право — только SELECT(Us_member.Us_id).
Sql=Data Source=lpc:.\SQLEXPRESS;Initial Catalog=AsdaStoryOp;Connect Timeout=3;Application Name=AsdaLogDrop
SqlUser=logdrop_ro
SqlPasswordFile=@@ASTORY_SERVER_ROOT@@\Working_ASDA\v2\LogDrop\service\secrets\sql_logdrop_ro.txt
